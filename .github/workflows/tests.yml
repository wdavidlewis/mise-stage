name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Run tests
        run: python -m unittest discover -s tests

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: python -m ruff check python tests
      - name: Type check with mypy
        run: python -m mypy
