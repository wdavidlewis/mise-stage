# Default settings for every show. A show file (config/<SHOW>.yaml) may
# override any key listed here, and only these keys.
DEFAULT_RENDER_WIDTH: 1920
DEFAULT_RENDER_HEIGHT: 1080
# Root folder of the previs files; a show sets its own. The tree under it is
# <root>/sequences/<sequence>/a<action>/v<version>/. Empty means not set.
PREVIS_FILE_ROOT: ""
